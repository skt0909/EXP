name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - "requirements.txt"
      - "alembic.ini"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fpl_game_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fpl_game_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fpl_game_test
      # Worker/celery_app.py requires this -- it has no localhost fallback,
      # matching DATABASE_URL. Points at the redis service above.
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest backend/Tests -v
