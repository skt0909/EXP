name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fpl_game_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fpl_game_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fpl_game_test
      # Worker/celery_app.py requires this -- it has no localhost fallback,
      # matching DATABASE_URL. Points at the redis service above.
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/0
      # Migration c41a9e27d06b empties the gameplay tables and refuses to run
      # unless this names the database it is connected to. Both URLs above
      # point at fpl_game_test, so this unlocks the wipe for the CI database
      # and nothing else. It must never name fpl_game or pitchside_db.
      ALLOW_GAMEPLAY_WIPE: fpl_game_test
      JWT_SECRET: ci-only-secret-never-used-outside-this-job
      ALLOWED_ORIGINS: http://localhost:5173
      RATE_LIMIT_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest backend/Tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
