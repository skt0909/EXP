# /etc/nginx/sites-available/fpl  (then: ln -s ../sites-available/fpl /etc/nginx/sites-enabled/)
#
# Serves the built frontend (npm run build -> frontend/dist, copied to
# /opt/fpl/frontend/dist) and proxies /api/ to uvicorn, stripping the
# prefix exactly like frontend/vite.config.js does in dev. Same origin, so
# the browser never makes a cross-origin call; ALLOWED_ORIGINS in .env
# should still be set to https://your-domain.
#
# HTTPS: run `sudo certbot --nginx -d your-domain` once; it edits this file.

# Blunt per-IP flood limit in front of everything, before Python sees it.
# The per-endpoint limits (login, chat, ...) are in backend/Shared/rate_limit.py.
limit_req_zone $binary_remote_addr zone=fpl_api:10m rate=10r/s;

server {
    listen 80;
    server_name your-domain;

    # No request body needs more than this; stops big uploads being read
    # into the API's memory.
    client_max_body_size 64k;

    root /opt/fpl/frontend/dist;
    index index.html;

    location /api/ {
        limit_req zone=fpl_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8030/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;  # /chat waits on Groq
    }

    # Single-page app: unknown paths get index.html so client-side routes work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
