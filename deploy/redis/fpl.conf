# Append to /etc/redis/redis.conf (Redis from apt, not Docker -- the
# Docker daemon alone costs ~50-100 MB on a 1 GB box). Then:
#   sudo systemctl restart redis-server
#
# Holds only Celery's small queue (db 0) and rate-limit counters (db 2).

bind 127.0.0.1 -::1
protected-mode yes

maxmemory 64mb
# noeviction on purpose: an LRU policy would silently drop queued tasks.
# A full Redis refuses writes loudly instead.
maxmemory-policy noeviction

# No persistence: nothing here needs to survive a restart (live-poll
# checkpoints are tracked in Postgres), and RDB saves fork the process.
save ""
appendonly no
