# Copy to /etc/postgresql/18/main/conf.d/fpl-tuning.conf, then:
#   sudo systemctl restart postgresql
#
# The whole database is ~20 MB now and ~30-70 MB by season's end, so a
# 64 MB cache still holds it. The API and worker each open at most 3 + 2
# pooled connections (backend/Shared/db_utils.py), ~10 in total.

listen_addresses = 'localhost'
shared_buffers = 64MB
effective_cache_size = 256MB
work_mem = 4MB
maintenance_work_mem = 32MB
max_connections = 20
